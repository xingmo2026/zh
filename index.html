<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jijia 科技 - 官方外挂发卡网</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff4757;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --alipay-blue: #1677ff;
            --wechat-green: #07c160;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        /* 左侧商品信息 */
        .product-info {
            padding: 40px;
            flex: 1;
            border-right: 1px solid #333;
        }
        .product-info h1 { font-size: 28px; margin-bottom: 10px; }
        .product-info .version { color: var(--primary); font-size: 14px; margin-bottom: 20px; display: inline-block; background: rgba(255, 71, 87, 0.1); padding: 4px 10px; border-radius: 4px; }
        .product-info p { color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }
        .feature-list { list-style: none; margin-bottom: 20px; }
        .feature-list li { margin-bottom: 10px; color: var(--text-sub); }
        .feature-list li::before { content: '✓'; color: #2ed573; margin-right: 10px; font-weight: bold; }

        /* 右侧购买面板 */
        .purchase-panel {
            padding: 40px;
            width: 350px;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .price { font-size: 36px; font-weight: bold; color: var(--primary); margin-bottom: 20px; text-align: center; }
        .price span { font-size: 16px; color: var(--text-sub); font-weight: normal; }
        
        .options { margin-bottom: 25px; }
        .options label { display: block; margin-bottom: 10px; color: var(--text-sub); font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #444;
            color: var(--text-sub);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-group button.active {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        .buy-btn:hover { background-color: #ff6b81; }

        /* 新增：支付方式按钮组 */
        .pay-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .pay-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }
        .pay-btn:hover { opacity: 0.8; }
        .alipay-btn { background-color: var(--alipay-blue); }
        .wechat-btn { background-color: var(--wechat-green); }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .product-info { border-right: none; border-bottom: 1px solid #333; padding: 20px; }
            .purchase-panel { width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：商品介绍 -->
    <div class="product-info">
        <h1>幽灵客户端 (Ghost Client)</h1>
        <div class="version">v2.4.1 稳定版</div>
        <p>专为 Minecraft Java 版打造的高级外挂插件。极低特征，稳定绕过主流反作弊系统，助你登顶巅峰。</p>
        <ul class="feature-list">
            <li>硬件级虚拟化防封</li>
            <li>毫秒级响应，无延迟</li>
            <li>内置 50+ 实用战斗与视觉模块</li>
            <li>支持 Win10 / Win11 系统</li>
        </ul>
    </div>

    <!-- 右侧：购买选项 -->
    <div class="purchase-panel">
        <div class="price" id="displayPrice">¥ 30<span> / 月</span></div>
        
        <div class="options">
            <label>选择授权时长：</label>
            <div class="btn-group">
                <button class="active" onclick="selectPlan('month', 30, this)">1个月</button>
                <button onclick="selectPlan('season', 80, this)">3个月</button>
                <button onclick="selectPlan('year', 298, this)">永久</button>
            </div>
        </div>

        <!-- 主支付按钮 -->
        <button class="buy-btn" onclick="processPayment()">立即支付</button>

        <!-- 新增：支付宝和微信快捷唤醒按钮 -->
        <div class="pay-methods">
            <button class="pay-btn alipay-btn" onclick="launchAlipay()">支付宝支付</button>
            <button class="pay-btn wechat-btn" onclick="launchWeChat()">微信支付</button>
        </div>
    </div>
</div>

<script>
    // 切换套餐逻辑
    function selectPlan(planType, price, btnElement) {
        const buttons = document.querySelectorAll('.btn-group button');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const priceDisplay = document.getElementById('displayPrice');
        let suffix = planType === 'year' ? '' : ' / 月';
        if(planType === 'season') suffix = ' / 季';
        if(planType === 'year') suffix = ' / 永久';
        
        priceDisplay.innerHTML = `¥ ${price}<span>${suffix}</span>`;
    }

    // 原有逻辑：下载并拉起QQ群
    function processPayment() {
        const qqGroupNumber = '142592996';
        const downloadUrl = 'https://github.com/xingmo2026/xingmo2026.github.io/releases/latest/download/nb.jar';

        // 1. 后台静默触发下载
        const downloadLink = document.createElement('a');
        downloadLink.href = downloadUrl;
        downloadLink.setAttribute('download', 'nb.jar'); 
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // 2. 延迟 0.5 秒后，直接尝试拉起 QQ
        setTimeout(() => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile) {
                // 手机/平板端：直接唤起 QQ App
                window.location.href = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${qqGroupNumber}&card_type=group&source=qrcode`;
            } else {
                // 电脑端：网页唤起 QQ
                window.open(`https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`, '_blank');
            }
        }, 500); 
    }

    // 新增：唤起支付宝
    function launchAlipay() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile) {
            // 尝试通过 URL Scheme 拉起手机支付宝 App
            window.location.href = 'alipays://platformapi/startapp';
            
            // 备用方案：如果几秒后没跳转，提示用户
            setTimeout(() => {
                // 如果还在当前页面，说明可能没有安装支付宝
                // alert('未能拉起支付宝，请确认已安装 App');
            }, 2000);
        } else {
            // 电脑端：打开支付宝网页版
            window.open('https://www.alipay.com/', '_blank');
        }
    }

    // 新增：唤起微信
    function launchWeChat() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile) {
            // 尝试通过 URL Scheme 拉起手机微信 App
            // 微信的 scheme 比较特殊，weixin:// 是标准的
            window.location.href = 'weixin://';
            
            // 备用方案
            setTimeout(() => {
                // 如果还在当前页面，说明可能没有安装微信
                // alert('未能拉起微信，请确认已安装 App');
            }, 2000);
        } else {
            // 电脑端：打开微信网页版（现已整合进文件传输助手网页版）
            window.open('https://wx.qq.com/', '_blank');
        }
    }
</script>

</body>
</html>
