<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>huanyu外挂商店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
    background:#121212;
    color:#fff;
    padding:50px 15px;
}
.container{
    max-width:500px;
    margin:0 auto;
}
.header{
    text-align:center;
    margin-bottom:35px;
}
.header h1{
    color:#4ade80;
    font-size:28px;
    margin-bottom:10px;
}
.header p{
    color:#aaa;
}
.card{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:12px;
    padding:30px;
    text-align:center;
}
.card h3{
    color:#60a5fa;
    font-size:22px;
    margin-bottom:12px;
}
.card p{
    color:#b8b8b8;
    font-size:15px;
    line-height:1.6;
    margin-bottom:16px;
}
.price{
    color:#facc15;
    font-weight:bold;
    font-size:20px;
    margin-bottom:20px;
}
.buy-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition: 0.2s;
}
.buy-btn:hover{background:#16a34a;}
.tip{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-top:25px;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>MC服务器插件商店</h1>
        <p>适配Purpur / Spigot / Paper 1.16~1.21</p>
    </div>

    <div class="card">
        <h3>huanyu外挂插件</h3>
        <p>飞天框都自动瞄准适合生存养老服</p>
        <div class="price">¥29.9</div>
        <button class="buy-btn" onclick="joinQQ()">立即购买</button>
    </div>

    <div class="tip">
        提示：点击购买即可进群获取插件资源<br>
        仅服务器合法插件，作弊功能
    </div>
</div>

<script>
function joinQQ(){
    const qqGroupUrl = "tencent://groupwpa/?subcmd=all&groupid=142592996";
    window.location.href = qqGroupUrl;
    setTimeout(()=>{
        alert("唤起QQ失败！请手动搜索QQ群号：142592996");
    }, 700);
}
</script>
</body>
</html>
