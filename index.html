<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>幻域互通交易中心</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; padding-top: 50px; }
        .panel { background: #2d2d2d; padding: 30px; border-radius: 10px; width: 400px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .hidden { display: none; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #444; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="panel">
    <!-- 登录/注册区 -->
    <div id="auth-area">
        <h3>🔐 玩家登录 / 注册</h3>
        <input type="text" id="user" placeholder="输入游戏ID (区分大小写)">
        <input type="password" id="pass" placeholder="输入网页密码">
        <button onclick="auth('login')">登录</button>
        <button onclick="auth('register')" style="background:#2196F3;">注册账号</button>
    </div>

    <!-- 交易区 (登录后可见) -->
    <div id="shop-area" class="hidden">
        <h3>🛒 欢迎, <span id="displayUser" style="color:#4CAF50;"></span></h3>
        <p style="color:#aaa; font-size:12px;">你必须在游戏内保持在线，且背包里有钻石！</p>
        <div id="items-list"></div>
        <button onclick="logout()" style="background:#f44336; margin-top:20px;">退出登录</button>
        
        <!-- 隐藏的管理员按钮 -->
        <button onclick="adminCheck()" style="background:#9E9E9E; font-size:12px; margin-top:10px;">管理员验证</button>
    </div>
</div>

<script>
    // 换成你的服务器 IP 和端口 (确保面板已放行 TCP 8080)
    const API_BASE = 'http://你的服务器IP:8080';

    // 默认商品列表 (网页端配置)
    const shopItems = [
        { id: 'diamond_sword', name: '🗡️ 钻石剑' },
        { id: 'netherite_sword', name: '🗡️ 下界合金剑' },
        { id: 'bow', name: '🏹 原版弓' }
    ];

    let currentUser = localStorage.getItem('mc_user') || null;

    window.onload = () => {
        if (currentUser) showShop();
    };

    async function auth(action) {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        if (!user || !pass) return alert("请填写完整！");

        const res = await fetch(`${API_BASE}/api/auth`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, user, pass })
        });
        const data = await res.json();
        alert(data.msg);
        
        if (data.success && action === 'login') {
            currentUser = user;
            localStorage.setItem('mc_user', user);
            showShop();
        }
    }

    function showShop() {
        document.getElementById('auth-area').classList.add('hidden');
        document.getElementById('shop-area').classList.remove('hidden');
        document.getElementById('displayUser').innerText = currentUser;
        
        let html = '';
        shopItems.forEach(item => {
            html += `<div class="item-row">
                <span>${item.name}</span>
                <button onclick="buy('${item.id}')" style="width: auto; margin:0; padding: 5px 15px;">1 钻石兑换</button>
            </div>`;
        });
        document.getElementById('items-list').innerHTML = html;
    }

    async function buy(itemId) {
        const res = await fetch(`${API_BASE}/api/buy`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: currentUser, item: itemId })
        });
        const data = await res.json();
        alert(data.msg);
    }

    function logout() {
        localStorage.removeItem('mc_user');
        location.reload();
    }

    // 管理员测试功能
    async function adminCheck() {
        const token = prompt("请输入管理员密码：");
        if (!token) return;
        const res = await fetch(`${API_BASE}/api/admin`, {
            method: 'POST', headers: { 'Authorization': token }
        });
        if (res.status === 403) alert("密码错误，你不是管理员！");
        else alert("✅ 管理员身份验证成功！(后续可在此扩展增删改查功能)");
    }
</script>
</body>
</html>
