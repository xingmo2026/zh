<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jijia 科技 - 官方外挂发卡网</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff4757;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        /* 左侧商品信息 */
        .product-info {
            padding: 40px;
            flex: 1;
            border-right: 1px solid #333;
        }
        .product-info h1 { font-size: 28px; margin-bottom: 10px; }
        .product-info .version { color: var(--primary); font-size: 14px; margin-bottom: 20px; display: inline-block; background: rgba(255, 71, 87, 0.1); padding: 4px 10px; border-radius: 4px; }
        .product-info p { color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 10px; color: var(--text-sub); }
        .feature-list li::before { content: '✓'; color: #2ed573; margin-right: 10px; font-weight: bold; }

        /* 右侧购买面板 */
        .purchase-panel {
            padding: 40px;
            width: 350px;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .price { font-size: 36px; font-weight: bold; color: var(--primary); margin-bottom: 20px; text-align: center; }
        .price span { font-size: 16px; color: var(--text-sub); font-weight: normal; }
        
        .options { margin-bottom: 25px; }
        .options label { display: block; margin-bottom: 10px; color: var(--text-sub); font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #444;
            color: var(--text-sub);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-group button.active {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .buy-btn:hover { background-color: #ff6b81; }

        @media (max-width: 768px) {
            .container { flex-direction: column; margin: 20px; }
            .product-info { border-right: none; border-bottom: 1px solid #333; }
            .purchase-panel { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：商品介绍 -->
    <div class="product-info">
        <h1>幽灵客户端 (Ghost Client)</h1>
        <div class="version">v2.4.1 稳定版</div>
        <p>专为 Minecraft Java 版打造的高级外挂插件。极低特征，稳定绕过主流反作弊系统，助你登顶巅峰。</p>
        <ul class="feature-list">
            <li>硬件级虚拟化防封</li>
            <li>毫秒级响应，无延迟</li>
            <li>内置 50+ 实用战斗与视觉模块</li>
            <li>支持 Win10 / Win11 系统</li>
        </ul>
    </div>

    <!-- 右侧：购买选项 -->
    <div class="purchase-panel">
        <div class="price" id="displayPrice">¥ 30<span> / 月</span></div>
        
        <div class="options">
            <label>选择授权时长：</label>
            <div class="btn-group">
                <button class="active" onclick="selectPlan('month', 30, this)">1个月</button>
                <button onclick="selectPlan('season', 80, this)">3个月</button>
                <button onclick="selectPlan('year', 298, this)">永久</button>
            </div>
        </div>

        <!-- 修改了按钮文字，提示用户会下载并加群 -->
        <button class="buy-btn" onclick="downloadAndJoin()">立即下载 / 加入QQ群</button>
    </div>
</div>

<script>
    // 切换套餐逻辑
    function selectPlan(planType, price, btnElement) {
        const buttons = document.querySelectorAll('.btn-group button');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const priceDisplay = document.getElementById('displayPrice');
        let suffix = planType === 'year' ? '' : ' / 月';
        if(planType === 'season') suffix = ' / 季';
        if(planType === 'year') suffix = ' / 永久';
        
        priceDisplay.innerHTML = `¥ ${price}<span>${suffix}</span>`;
    }

    // 新增：点击按钮执行下载并跳转 QQ 群
    function downloadAndJoin() {
        const qqGroupNumber = '142592996';
        // 你的 GitHub 下载直链
        const downloadUrl = 'https://release-assets.githubusercontent.com/github-production-release-asset/1413061039/a0388993-1b8c-4dde-8007-afc3e6c4f0b4?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-11-01T15%3A52%3A31Z&rscd=attachment%3B+filename%3Dnb.jar&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-11-01T14%3A51%3A46Z&ske=2026-11-01T15%3A52%3A31Z&sks=b&skv=2018-11-09&sig=nN7mW2sXsD7CZqn4dYUyi1AjSrTkWCHVtXcV3BXPMWo%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MzU0NTAwNywibmJmIjoxNzkzNTQ0NzA3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.lc3HJ0dT3Kd2Es6Je82Y444cSznQhyKNzSs7ZDG_YB8&response-content-disposition=attachment%3B%20filename%3Dnb.jar&response-content-type=application%2Foctet-stream';

        // 1. 创建一个隐藏的 a 标签来触发下载
        const downloadLink = document.createElement('a');
        downloadLink.href = downloadUrl;
        // 添加 download 属性提示浏览器直接下载，但由于跨域，主要依赖服务器返回的 attachment 头
        downloadLink.setAttribute('download', 'nb.jar'); 
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // 2. 延迟 1 秒后执行 QQ 群跳转（给浏览器一点时间处理下载）
        setTimeout(() => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile) {
                // 手机端跳转逻辑
                window.location.href = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${qqGroupNumber}&card_type=group&source=qrcode`;
                setTimeout(() => {
                    window.location.href = `https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`;
                }, 1500);
            } else {
                // 电脑端跳转逻辑
                window.open(`https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`, '_blank');
            }
        }, 1000); 
    }
</script>

</body>
</html>
