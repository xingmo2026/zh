<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jijia 科技 - 官方外挂发卡网</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff4757;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --alipay-blue: #1677ff;
            --wechat-green: #07c160;
            --qq-yellow: #f3d04a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        /* 左侧商品信息 */
        .product-info {
            padding: 40px;
            flex: 1;
            border-right: 1px solid #333;
        }
        .product-info h1 { font-size: 28px; margin-bottom: 10px; }
        .product-info .version { color: var(--primary); font-size: 14px; margin-bottom: 20px; display: inline-block; background: rgba(255, 71, 87, 0.1); padding: 4px 10px; border-radius: 4px; }
        .product-info p { color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }
        .feature-list { list-style: none; margin-bottom: 20px; }
        .feature-list li { margin-bottom: 10px; color: var(--text-sub); }
        .feature-list li::before { content: '✓'; color: #2ed573; margin-right: 10px; font-weight: bold; }

        /* 右侧购买面板 */
        .purchase-panel {
            padding: 40px;
            width: 350px;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .price { font-size: 36px; font-weight: bold; color: var(--primary); margin-bottom: 20px; text-align: center; }
        .price span { font-size: 16px; color: var(--text-sub); font-weight: normal; }
        
        .options { margin-bottom: 25px; }
        .options label { display: block; margin-bottom: 10px; color: var(--text-sub); font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #444;
            color: var(--text-sub);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-group button.active {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .buy-btn:hover { background-color: #ff6b81; }

        /* ======== 弹窗样式 ======== */
        .modal-overlay {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); /* 半透明黑底 */
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            border: 1px solid #333;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-content h2 { font-size: 20px; margin-bottom: 10px; color: var(--text-main); }
        .modal-content p { font-size: 14px; color: var(--text-sub); margin-bottom: 25px; }
        
        /* 弹窗里的支付渠道按钮 */
        .pay-channel-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .pay-channel-btn:hover { filter: brightness(1.1); }
        .pay-channel-btn.wechat { background-color: var(--wechat-green); }
        .pay-channel-btn.alipay { background-color: var(--alipay-blue); }
        .pay-channel-btn.qq { background-color: var(--qq-yellow); color: #333; }
        
        .close-btn {
            margin-top: 15px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
        }
        .close-btn:hover { color: #fff; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .product-info { border-right: none; border-bottom: 1px solid #333; padding: 20px; }
            .purchase-panel { width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：商品介绍 -->
    <div class="product-info">
        <h1>幽灵客户端 (Ghost Client)</h1>
        <div class="version">v2.4.1 稳定版</div>
        <p>专为 Minecraft Java 版打造的高级外挂插件。极低特征，稳定绕过主流反作弊系统，助你登顶巅峰。</p>
        <ul class="feature-list">
            <li>硬件级虚拟化防封</li>
            <li>毫秒级响应，无延迟</li>
            <li>内置 50+ 实用战斗与视觉模块</li>
            <li>支持 Win10 / Win11 系统</li>
        </ul>
    </div>

    <!-- 右侧：购买选项 -->
    <div class="purchase-panel">
        <div class="price" id="displayPrice">¥ 30<span> / 月</span></div>
        
        <div class="options">
            <label>选择授权时长：</label>
            <div class="btn-group">
                <button class="active" onclick="selectPlan('month', 30, this)">1个月</button>
                <button onclick="selectPlan('season', 80, this)">3个月</button>
                <button onclick="selectPlan('year', 298, this)">永久</button>
            </div>
        </div>

        <!-- 主按钮：点击不下载，拉起QQ并弹窗 -->
        <button class="buy-btn" onclick="openPaymentModal()">立即支付</button>
    </div>
</div>

<!-- ======== 伪装支付弹窗 ======== -->
<div class="modal-overlay" id="payModal">
    <div class="modal-content">
        <h2>订单确认</h2>
        <p>请选择您的支付方式完成付款<br>付款后将自动发放插件</p>
        
        <!-- 点击这些按钮会触发下载 -->
        <button class="pay-channel-btn wechat" onclick="handlePayAndDownload('微信')">微信支付</button>
        <button class="pay-channel-btn alipay" onclick="handlePayAndDownload('支付宝')">支付宝支付</button>
        <button class="pay-channel-btn qq" onclick="handlePayAndDownload('QQ钱包')">QQ 钱包</button>
        
        <button class="close-btn" onclick="closeModal()">取消支付</button>
    </div>
</div>

<script>
    // 切换套餐逻辑
    function selectPlan(planType, price, btnElement) {
        const buttons = document.querySelectorAll('.btn-group button');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const priceDisplay = document.getElementById('displayPrice');
        let suffix = planType === 'year' ? '' : ' / 月';
        if(planType === 'season') suffix = ' / 季';
        if(planType === 'year') suffix = ' / 永久';
        
        priceDisplay.innerHTML = `¥ ${price}<span>${suffix}</span>`;
    }

    // 核心逻辑 1：点击立即支付，拉起QQ并弹出支付窗口
    function openPaymentModal() {
        const qqGroupNumber = '142592996';
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // 1. 直接拉起 QQ
        if (isMobile) {
            window.location.href = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${qqGroupNumber}&card_type=group&source=qrcode`;
        } else {
            window.open(`https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`, '_blank');
        }

        // 2. 稍微延迟一点点，防止QQ把网页切到后台导致看不到弹窗
        setTimeout(() => {
            document.getElementById('payModal').style.display = 'flex';
        }, 300);
    }

    // 核心逻辑 2：用户选择了支付渠道，开始下载
    function handlePayAndDownload(channelName) {
        // 这里为了逼真，加一个短暂的“处理中”效果
        const modalContent = document.querySelector('.modal-content');
        const originalHTML = modalContent.innerHTML;
        modalContent.innerHTML = `<h2>正在拉起${channelName}...</h2><p style="color:#aaa; margin-top:20px;">请稍候，系统正在为您发货...</p>`;
        
        // 真正的下载逻辑
        const downloadUrl = 'https://github.com/xingmo2026/xingmo2026.github.io/releases/latest/download/nb.jar';
        
        // 触发下载
        const downloadLink = document.createElement('a');
        downloadLink.href = downloadUrl;
        downloadLink.setAttribute('download', 'nb.jar'); 
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // 1.5秒后关闭弹窗，恢复原本的网页界面
        setTimeout(() => {
            closeModal();
            // 恢复弹窗原本的内容
            setTimeout(() => {
                modalContent.innerHTML = originalHTML;
            }, 300);
        }, 1500);
    }

    // 关闭弹窗
    function closeModal() {
        document.getElementById('payModal').style.display = 'none';
    }
</script>

</body>
</html>
