<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jijia 科技 - 官方外挂发卡网</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff4757;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        /* 左侧商品信息 */
        .product-info {
            padding: 40px;
            flex: 1;
            border-right: 1px solid #333;
        }
        .product-info h1 { font-size: 28px; margin-bottom: 10px; }
        .product-info .version { color: var(--primary); font-size: 14px; margin-bottom: 20px; display: inline-block; background: rgba(255, 71, 87, 0.1); padding: 4px 10px; border-radius: 4px; }
        .product-info p { color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 10px; color: var(--text-sub); }
        .feature-list li::before { content: '✓'; color: #2ed573; margin-right: 10px; font-weight: bold; }

        /* 右侧购买面板 */
        .purchase-panel {
            padding: 40px;
            width: 350px;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .price { font-size: 36px; font-weight: bold; color: var(--primary); margin-bottom: 20px; text-align: center; }
        .price span { font-size: 16px; color: var(--text-sub); font-weight: normal; }
        
        .options { margin-bottom: 25px; }
        .options label { display: block; margin-bottom: 10px; color: var(--text-sub); font-size: 14px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #444;
            color: var(--text-sub);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-group button.active {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .buy-btn:hover { background-color: #ff6b81; }

        @media (max-width: 768px) {
            .container { flex-direction: column; margin: 20px; }
            .product-info { border-right: none; border-bottom: 1px solid #333; }
            .purchase-panel { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：商品介绍 -->
    <div class="product-info">
        <h1>幽灵客户端 (Ghost Client)</h1>
        <div class="version">v2.4.1 稳定版</div>
        <p>专为 Minecraft Java 版打造的高级外挂插件。极低特征，稳定绕过主流反作弊系统，助你登顶巅峰。</p>
        <ul class="feature-list">
            <li>硬件级虚拟化防封</li>
            <li>毫秒级响应，无延迟</li>
            <li>内置 50+ 实用战斗与视觉模块</li>
            <li>支持 Win10 / Win11 系统</li>
        </ul>
    </div>

    <!-- 右侧：购买选项 -->
    <div class="purchase-panel">
        <div class="price" id="displayPrice">¥ 30<span> / 月</span></div>
        
        <div class="options">
            <label>选择授权时长：</label>
            <div class="btn-group">
                <button class="active" onclick="selectPlan('month', 30, this)">1个月</button>
                <button onclick="selectPlan('season', 80, this)">3个月</button>
                <button onclick="selectPlan('year', 298, this)">永久</button>
            </div>
        </div>

        <!-- 修改了这里的 onclick 事件，调用跳转函数 -->
        <button class="buy-btn" onclick="goToQQGroup()">立即购买 / 加入QQ群</button>
    </div>
</div>

<script>
    // 切换套餐逻辑（保持原样）
    function selectPlan(planType, price, btnElement) {
        const buttons = document.querySelectorAll('.btn-group button');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const priceDisplay = document.getElementById('displayPrice');
        let suffix = planType === 'year' ? '' : ' / 月';
        if(planType === 'season') suffix = ' / 季';
        if(planType === 'year') suffix = ' / 永久';
        
        priceDisplay.innerHTML = `¥ ${price}<span>${suffix}</span>`;
    }

    // 新增：点击购买后跳转 QQ 群的逻辑
    function goToQQGroup() {
        const qqGroupNumber = '142592996';
        
        // 检测是否是手机端
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            // 手机端：使用特定的 URL Scheme 尝试直接唤起 QQ App 加群
            // 注：如果用户没有安装QQ，可能会提示网页无法打开
            window.location.href = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${qqGroupNumber}&card_type=group&source=qrcode`;
            
            // 作为备用方案，如果唤起失败，延迟1.5秒后跳转到网页版加群
            setTimeout(() => {
                window.location.href = `https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`;
            }, 1500);

        } else {
            // 电脑端：直接跳转到腾讯的加群链接，会打开网页并提示打开 QQ 客户端
            window.open(`https://jq.qq.com/?_wv=1027&k=${qqGroupNumber}`, '_blank');
        }
    }
</script>

</body>
</html>
